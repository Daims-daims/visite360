<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mes visites</title>
  <link rel="stylesheet" href="espace.css">
</head>
<body>
  <main>
    <header>
      <h1>Mes visites</h1>
      <div id="compte" hidden>
        <span id="adresse"></span>
        <button type="button" id="deconnexion" class="discret">Se déconnecter</button>
      </div>
    </header>

    <section id="connexion" hidden>
      <form id="form-adresse">
        <label for="email">Adresse e-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <button type="submit" class="principal">Recevoir un code</button>
      </form>
      <form id="form-code" hidden>
        <p id="info-code"></p>
        <label for="code">Code reçu par e-mail</label>
        <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9 ]{6,7}" maxlength="7" required>
        <button type="submit" class="principal">Se connecter</button>
        <button type="button" id="autre-adresse" class="discret">Changer d'adresse</button>
      </form>
    </section>

    <section id="liste" hidden>
      <p class="aide">Les visites se prennent et s'envoient avec l'app de l'iPhone. Leur assemblage prend quelques minutes par point.</p>
      <p id="vide" hidden>Aucune visite envoyée pour l'instant.</p>
      <ul id="visites"></ul>
    </section>

    <p id="message" role="status"></p>
  </main>
  <script src="espace.js"></script>
</body>
</html>
