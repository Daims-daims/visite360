[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visite360"
dynamic = ["version"]
description = "Transforme des photos prises au téléphone en visite 360° modifiable d'un logement."
readme = "README.md"
requires-python = ">=3.11"
# OpenCV n'est pas déclaré ici : il est compilé sans FFmpeg par scripts/installer-opencv.sh (D19).
dependencies = [
    "numpy>=1.26",
]
classifiers = [
    # Empêche tout envoi accidentel sur PyPI.
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
visite360 = "visite360.cli:main"

[tool.hatch.version]
path = "src/visite360/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/visite360"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
