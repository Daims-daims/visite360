name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer le projet
        run: python -m pip install -e ".[dev]"
      - name: Garder OpenCV compilé entre deux exécutions
        uses: actions/cache@v4
        with:
          path: build/opencv
          key: opencv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('scripts/installer-opencv.sh') }}
      - name: Compiler et installer OpenCV sans FFmpeg
        run: bash scripts/installer-opencv.sh
      - name: Style
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest
