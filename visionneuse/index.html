<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Visite 360°</title>
  <link rel="stylesheet" href="/pannellum/pannellum.css">
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    #panorama { width: 100%; height: 100%; }
    #message { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; padding: 24px; text-align: center; }
    #bar { width: min(420px, 80vw); height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #4da3ff; transition: width .6s ease; }
    #bar, #detail { display: none; }
    #detail { color: #aaa; font-size: 14px; }
    #points, #cap { position: fixed; z-index: 10; margin: 12px; padding: 6px 10px; border-radius: 8px;
      background: rgba(0, 0, 0, .55); color: #fff; font-size: 14px; border: 0; }
    #points { top: 0; right: 0; display: none; max-width: 60vw; }
    #cap { bottom: 0; left: 0; font-variant-numeric: tabular-nums; pointer-events: none; }
    /* Flèche vers un autre point : un rond blanc cliquable avec une flèche. */
    .pnlm-hotspot-base.fleche { width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 255, 255, .85);
      background-image: none; box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
    .pnlm-hotspot-base.fleche::before { content: "\2191"; display: block; text-align: center;
      line-height: 48px; font-size: 30px; color: #111; }
    /* Étape 7 : sélection d'une surface au clic. */
    button { font: inherit; cursor: pointer; }
    #outils { position: fixed; z-index: 10; right: 0; bottom: 0; margin: 12px; display: flex; gap: 8px;
      flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 24px); }
    #outils button, #liste button, #apercu button { padding: 8px 12px; border-radius: 8px; border: 0;
      background: rgba(0, 0, 0, .65); color: #fff; }
    #outils button.actif { background: #4da3ff; }
    #outils button:disabled { opacity: .45; cursor: default; }
    #calque { position: fixed; inset: 0; z-index: 5; display: none; overflow: hidden; cursor: crosshair;
      touch-action: none; }
    #calque img { position: absolute; pointer-events: none; }
    .repere { position: absolute; width: 14px; height: 14px; margin: -9px 0 0 -9px; border-radius: 50%;
      border: 2px solid #fff; pointer-events: none; }
    .repere.plus { background: #2ecc40; }
    .repere.moins { background: #ff4136; }
    #consigne, #apercu { position: fixed; z-index: 10; top: 0; left: 50%; transform: translateX(-50%);
      margin: 12px; padding: 8px 12px; border-radius: 8px; background: rgba(0, 0, 0, .7); color: #fff;
      font-size: 14px; display: none; max-width: calc(100vw - 48px); text-align: center; }
    #apercu { gap: 10px; align-items: center; }
    #liste { position: fixed; z-index: 10; right: 0; bottom: 56px; margin: 12px; padding: 10px;
      border-radius: 8px; background: rgba(0, 0, 0, .8); display: none; max-height: 50vh; overflow: auto;
      min-width: 240px; font-size: 14px; }
    #liste .ligne { display: flex; gap: 6px; align-items: center; justify-content: space-between;
      padding: 4px 0; }
    #liste .perimee { color: #ffb84d; font-size: 12px; }
    /* Étape 8 : changement de couleur. */
    #peinture { position: fixed; z-index: 10; bottom: 0; left: 50%; transform: translateX(-50%);
      margin: 12px 0; padding: 10px 12px; border-radius: 8px; background: rgba(0, 0, 0, .8); display: none;
      flex-direction: column; gap: 8px; width: min(560px, calc(100vw - 24px)); box-sizing: border-box;
      font-size: 14px; }
    #peinture .entete { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #peinture .entete span { flex: 1; min-width: 140px; }
    #peinture button { padding: 8px 12px; border-radius: 8px; border: 0; background: #333; color: #fff; }
    #peinture button.principal { background: #4da3ff; }
    #nuancier { max-height: 26vh; overflow-y: auto; }
    #peinture .actuelle { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: #ccc; font-size: 13px; }
    #peinture select { max-width: 260px; font: inherit; padding: 4px 6px; border-radius: 6px; border: 0; background: #333; color: #fff; }
    #actuelle-couleur { width: 34px; height: 26px; border: 0; padding: 0; background: none; }
    #nuancier .famille { color: #aaa; font-size: 12px; margin: 6px 0 4px; }
    #nuancier .teintes { display: flex; flex-wrap: wrap; gap: 6px; }
    #nuancier .teinte { position: relative; width: 34px; height: 34px; padding: 0; border-radius: 6px;
      border: 2px solid rgba(255, 255, 255, .25); cursor: pointer; }
    #nuancier .teinte.actif { border-color: #4da3ff; box-shadow: 0 0 0 2px #4da3ff; }
    #nuancier .perso { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px;
      background: conic-gradient(#e05a4f, #e0c14f, #5ac46a, #4fa3e0, #9b5ae0, #e05a4f); }
    #nuancier .perso input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
      border: 0; padding: 0; }
    /* Étape 9 : remplacement d'un objet par génération d'image. */
    #calque-cadre { position: fixed; inset: 0; z-index: 5; display: none; cursor: crosshair; touch-action: none; }
    #cadre { position: absolute; display: none; border: 2px dashed #fff; background: rgba(77, 163, 255, .18);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, .35); pointer-events: none; }
    #remplacement { position: fixed; z-index: 10; bottom: 0; left: 50%; transform: translateX(-50%);
      margin: 12px 0; padding: 10px 12px; border-radius: 8px; background: rgba(0, 0, 0, .85); display: none;
      flex-direction: column; gap: 8px; width: min(560px, calc(100vw - 24px)); box-sizing: border-box; font-size: 14px; }
    #remplacement label { display: flex; flex-direction: column; gap: 4px; color: #ccc; font-size: 13px; }
    #remplacement input { font: inherit; padding: 6px 8px; border-radius: 6px; border: 0; background: #333; color: #fff; }
    #remplacement .boutons { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    #remplacement button { padding: 8px 12px; border-radius: 8px; border: 0; background: #333; color: #fff; }
    #remplacement button.principal { background: #4da3ff; }
    #suggestions { display: flex; flex-wrap: wrap; gap: 6px; }
    #suggestions button { padding: 4px 8px; font-size: 12px; border-radius: 12px; background: #2a2a2a; }
    #remplacement .note { color: #999; font-size: 12px; }
    #suivi { position: fixed; z-index: 10; top: 52px; left: 50%; transform: translateX(-50%); margin: 0 12px;
      padding: 8px 12px; border-radius: 8px; background: rgba(0, 0, 0, .75); font-size: 14px; display: none;
      width: min(360px, calc(100vw - 48px)); box-sizing: border-box; text-align: center; }
    #suivi .barre { height: 6px; margin-top: 6px; background: #333; border-radius: 3px; overflow: hidden; }
    #suivi .barre div { height: 100%; width: 0; background: #4da3ff; transition: width .6s ease; }
    .pastille { display: inline-block; width: 14px; height: 14px; margin-right: 6px; border-radius: 3px;
      border: 1px solid #fff; vertical-align: -2px; }
  </style>
</head>
<body>
  <div id="panorama"></div>
  <select id="points" aria-label="Aller à un point"></select>
  <div id="cap"></div>
  <div id="calque"><img id="masque" alt=""></div>
  <div id="consigne"></div>
  <div id="apercu"><span id="apercu-nom"></span><button id="retour">Revenir à la visite</button></div>
  <div id="liste"></div>
  <div id="peinture">
    <div class="entete">
      <span><span id="peinture-nom"></span> <span id="teinte-choisie"></span></span>
      <button id="appliquer" class="principal">Appliquer</button>
      <button id="renoncer">Annuler</button>
    </div>
    <div class="actuelle">
      <label for="actuelle">Couleur actuelle du mur :</label>
      <select id="actuelle">
        <option value="blanc">Blanc</option>
        <option value="autre">Autre couleur…</option>
        <option value="photo">Je ne sais pas (comme sur la photo)</option>
      </select>
      <input id="actuelle-couleur" type="color" value="#e8e2d6" aria-label="Couleur actuelle du mur" hidden>
    </div>
    <div id="nuancier"></div>
  </div>
  <div id="calque-cadre"><div id="cadre"></div></div>
  <div id="remplacement">
    <label>Objet à remplacer, dans le cadre
      <input id="objet" maxlength="200" placeholder="par exemple : le canapé gris">
    </label>
    <label>Par quoi (laisser vide pour retirer l'objet)
      <input id="nouveau" maxlength="200" placeholder="par exemple : un canapé en velours vert">
    </label>
    <div id="suggestions"></div>
    <div class="note">Le modèle refait la vue autour du cadre, puis seul l'intérieur du cadre est gardé.
      Environ 2 minutes sur le Mac : on peut continuer la visite pendant ce temps.</div>
    <div class="boutons">
      <button id="generer" class="principal">Générer</button>
      <button id="renoncer-generation">Annuler</button>
    </div>
  </div>
  <div id="suivi"><span id="suivi-texte"></span><div class="barre"><div id="suivi-barre"></div></div></div>
  <div id="outils">
    <button id="transformer" hidden>Remplacer un objet</button>
    <button id="mes-remplacements" hidden>Remplacements</button>
    <button id="choisir" hidden>Sélectionner une surface</button>
    <button id="mes-selections" hidden>Sélections</button>
    <button id="avant-apres" hidden>Voir l'original</button>
    <button id="ajouter" hidden title="Ajouter à la sélection">+ Ajouter</button>
    <button id="retirer" hidden title="Retirer de la sélection (ou Alt + clic)">− Retirer</button>
    <button id="defaire" hidden>Annuler le dernier clic</button>
    <button id="valider" hidden>Valider</button>
    <button id="abandonner" hidden>Abandonner</button>
  </div>
  <div id="message">
    <div id="text"></div>
    <div id="bar"><div id="fill"></div></div>
    <div id="detail"></div>
  </div>
  <script src="/pannellum/pannellum.js"></script>
  <script>
    // Beaucoup de téléphones refusent les images plus larges que la limite de leur carte
    // graphique : on choisit la version du panorama que cet appareil sait afficher.
    function maxTextureSize() {
      try {
        const canvas = document.createElement("canvas");
        const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        return gl ? gl.getParameter(gl.MAX_TEXTURE_SIZE) : 0;
      } catch (error) {
        return 0;
      }
    }

    const box = document.getElementById("message");

    function show(text, progress, detail) {
      document.getElementById("text").textContent = text;
      const showBar = progress !== null;
      document.getElementById("bar").style.display = showBar ? "block" : "none";
      document.getElementById("detail").style.display = showBar ? "block" : "none";
      if (showBar) {
        document.getElementById("fill").style.width = Math.round(progress * 100) + "%";
        document.getElementById("detail").textContent = detail;
      }
      box.style.display = "flex";
    }

    function normalize(angle) {
      const wrapped = ((angle + 180) % 360 + 360) % 360 - 180;
      return Math.round(wrapped === -180 ? 180 : wrapped);
    }

    // Une scène Pannellum par point, avec une flèche cliquable par lien déclaré dans visite.json.
    // `panoramaUrl(index)` choisit l'image : d'origine, ou modifiée (étape 8).
    function buildScenes(info, panoramaUrl) {
      const scenes = {};
      for (const [index, point] of info.points.entries()) {
        scenes[point.id] = {
          title: point.name,
          type: "equirectangular",
          panorama: panoramaUrl(index),
          hotSpots: point.links.map((link) => ({
            type: "scene",
            sceneId: link.to,
            text: link.text,
            yaw: link.angle,
            pitch: link.pitch,
            cssClass: "fleche",
            targetYaw: "same",
            targetPitch: "same",
          })),
        };
      }
      return scenes;
    }

    function startViewer() {
      fetch("/info.json")
        .then((response) => response.json())
        .then(async (info) => {
          box.style.display = "none";
          document.title = info.name + " — visite 360°";
          const useFull = info.points.every((point) => maxTextureSize() >= point.full.width);
          // Étape 8 : recolorations de chaque point, pour ouvrir la visite en « après ».
          const colors = await Promise.all(info.points.map((point, index) =>
            fetch("/p/" + index + "/couleurs.json").then((r) => r.ok ? r.json() : null).catch(() => null)));
          const look = { useFull, colors, after: true };
          look.url = (index) => {
            const state = look.colors[index];
            if (look.after && state && state.version) {
              return "/p/" + index + "/" + (useFull ? "apres" : "apres-mobile") + ".jpg?v=" + state.version;
            }
            const point = info.points[index];
            return (useFull ? point.full : point.mobile).url;
          };
          const scenes = buildScenes(info, look.url);
          look.scenes = scenes;
          const viewer = pannellum.viewer("panorama", {
            default: { firstScene: info.start, sceneFadeDuration: 800, autoLoad: true, hfov: 100 },
            scenes: Object.assign({}, scenes),
            showControls: true,
          });

          const menu = document.getElementById("points");
          if (info.points.length > 1) {
            for (const point of info.points) {
              menu.add(new Option(point.name, point.id));
            }
            menu.value = info.start;
            menu.style.display = "block";
            menu.onchange = () => viewer.loadScene(menu.value);
            viewer.on("scenechange", (id) => { if (!id.startsWith("apercu:")) menu.value = id; });
          }

          // Aide pour déclarer un lien : l'angle du centre de l'écran et du dernier clic,
          // à recopier dans visite.json (« angle »).
          const cap = document.getElementById("cap");
          let click = null;
          const refresh = () => {
            let text = "Centre : " + normalize(viewer.getYaw()) + "°";
            if (click !== null) text += " · clic : " + click + "°";
            cap.textContent = text;
          };
          document.getElementById("panorama").addEventListener("click", (event) => {
            click = normalize(viewer.mouseEventToCoords(event)[1]);
            refresh();
          });
          viewer.on("scenechange", () => { click = null; });
          setInterval(refresh, 200);

          setupSelection(info, viewer, look);
        })
        .catch(() => show("Impossible de charger la visite.", null, ""));
    }

    async function postJson(path, body) {
      const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!response.ok) {
        let message = "Erreur " + response.status;
        try { message = (await response.json()).erreur || message; } catch (error) { /* pas de JSON */ }
        throw new Error(message);
      }
      return response;
    }

    // Étape 7 : sélection d'une surface. Le serveur découpe la vue regardée (une photo carrée,
    // sans la déformation du panorama), SAM 2.1 y trouve le contour autour des clics, et la
    // page pose ce contour par-dessus la visionneuse, immobilisée le temps de la sélection.
    function setupSelection(info, viewer, look) {
      const $ = (id) => document.getElementById(id);
      const layer = $("calque"), maskImage = $("masque"), hint = $("consigne");
      const selectButtons = ["ajouter", "retirer", "defaire", "valider", "abandonner"];
      let currentId = info.start, previewOf = null, state = null, busy = false, paint = null;

      viewer.on("scenechange", (id) => {
        if (!id.startsWith("apercu:")) {
          currentId = id;
          previewOf = null;
          $("apercu").style.display = "none";
          $("peinture").style.display = "none";
          $("outils").style.display = "flex";
          paint = null;
          updateToggle();
        }
        $("liste").style.display = "none";
        refreshList();
      });

      const pointIndex = () => info.points.findIndex((point) => point.id === currentId);
      const say = (text) => { hint.textContent = text; hint.style.display = text ? "block" : "none"; };
      const toRad = (deg) => deg * Math.PI / 180;

      function setMode(selecting) {
        $("choisir").hidden = selecting;
        $("mes-selections").hidden = selecting;
        if (selecting) $("avant-apres").hidden = true; else updateToggle();
        for (const id of selectButtons) $(id).hidden = !selecting;
        layer.style.display = selecting ? "block" : "none";
        $("liste").style.display = "none";
      }

      function setAdding(adding) {
        state.adding = adding;
        $("ajouter").classList.toggle("actif", adding);
        $("retirer").classList.toggle("actif", !adding);
      }

      // Correspondance entre l'écran et la vue carrée : la visionneuse et la vue sont deux
      // photos prises du même endroit dans la même direction, seule l'échelle change.
      function geometry() {
        const rect = $("panorama").getBoundingClientRect();
        const perTan = (rect.width / 2) / Math.tan(toRad(state.hfov) / 2);
        const focal = (state.size / 2) / Math.tan(toRad(state.fov) / 2);
        return { rect, scale: perTan / focal };
      }

      function placeMask() {
        const { rect, scale } = geometry();
        const side = state.size * scale;
        Object.assign(maskImage.style, {
          left: (rect.width - side) / 2 + "px", top: (rect.height - side) / 2 + "px",
          width: side + "px", height: side + "px",
        });
        layer.querySelectorAll(".repere").forEach((dot) => dot.remove());
        for (const click of state.clicks) {
          const dot = document.createElement("div");
          dot.className = "repere " + (click.ajout ? "plus" : "moins");
          dot.style.left = rect.width / 2 + (click.x - state.size / 2) * scale + "px";
          dot.style.top = rect.height / 2 + (click.y - state.size / 2) * scale + "px";
          layer.appendChild(dot);
        }
      }

      async function updateMask() {
        placeMask();
        if (!state.clicks.some((click) => click.ajout)) {
          maskImage.removeAttribute("src");
          say("Cliquez sur la surface à sélectionner.");
          return;
        }
        busy = true;
        try {
          const response = await postJson("/api/selection/masque", { vue: state.view, clics: state.clicks });
          const url = URL.createObjectURL(await response.blob());
          if (maskImage.src.startsWith("blob:")) URL.revokeObjectURL(maskImage.src);
          maskImage.src = url;
          say("+ pour ajouter une zone, − pour en retirer. Valider quand le contour est bon.");
        } catch (error) {
          say(error.message);
        } finally {
          busy = false;
        }
      }

      async function start() {
        if (busy) return;
        const response = await fetch("/api/selection").then((r) => r.json());
        if (!response.disponible) { say(response.message); return; }
        // Mesuré sur la visionneuse : le calque, encore masqué, aurait une taille nulle.
        const rect = $("panorama").getBoundingClientRect();
        const hfov = viewer.getHfov();
        const vfov = 2 * Math.atan(Math.tan(toRad(hfov) / 2) * rect.height / rect.width) * 180 / Math.PI;
        state = { hfov, fov: Math.min(Math.max(hfov, vfov), 120), clicks: [], adding: true, size: 1024 };
        setMode(true);
        setAdding(true);
        maskImage.removeAttribute("src");
        placeMask();
        busy = true;
        say("Préparation de la vue (la première fois, chargement du modèle : quelques secondes)...");
        try {
          const answer = await postJson("/api/selection/vue", {
            point: pointIndex(), cap: viewer.getYaw(), hauteur: viewer.getPitch(), champ: state.fov,
          }).then((r) => r.json());
          state.view = answer.vue;
          state.size = answer.taille;
          say("Cliquez sur la surface à sélectionner.");
        } catch (error) {
          stop();
          say(error.message);
        } finally {
          busy = false;
        }
      }

      function stop() {
        state = null;
        setMode(false);
        say("");
      }

      layer.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        if (!state || !state.view || busy) return;
        const { rect, scale } = geometry();
        const x = state.size / 2 + (event.clientX - rect.left - rect.width / 2) / scale;
        const y = state.size / 2 + (event.clientY - rect.top - rect.height / 2) / scale;
        if (x < 0 || y < 0 || x >= state.size || y >= state.size) {
          say("Ce point est hors de la vue préparée : abandonner et réorienter la vue.");
          return;
        }
        state.clicks.push({ x, y, ajout: state.adding && !event.altKey && event.button !== 2 });
        updateMask();
      });
      layer.addEventListener("contextmenu", (event) => event.preventDefault());
      window.addEventListener("resize", () => { if (state) placeMask(); });
      document.addEventListener("keydown", (event) => { if (state && event.key === "Escape") stop(); });

      $("choisir").onclick = start;
      $("ajouter").onclick = () => setAdding(true);
      $("retirer").onclick = () => setAdding(false);
      $("abandonner").onclick = stop;
      $("defaire").onclick = () => { if (state && !busy && state.clicks.pop()) updateMask(); };
      $("valider").onclick = async () => {
        if (!state || busy || !state.clicks.some((click) => click.ajout)) return;
        const name = window.prompt("Nom de la sélection (par exemple « Mur du canapé ») :", "");
        if (name === null) return;
        busy = true;
        say("Report de la sélection dans le panorama...");
        try {
          const record = await postJson("/api/selection/valider", {
            vue: state.view, clics: state.clicks, nom: name,
          }).then((r) => r.json());
          stop();
          say("« " + record.nom + " » enregistrée. Bouton « Sélections » pour la revoir.");
          refreshList();
        } catch (error) {
          say(error.message);
        } finally {
          busy = false;
        }
      };

      // Sélections enregistrées du point affiché : aperçu dans le panorama entier, suppression.
      async function refreshList() {
        const index = pointIndex();
        if (index < 0) return [];
        const records = await fetch("/p/" + index + "/selections.json").then((r) => r.ok ? r.json() : []);
        $("mes-selections").textContent = "Sélections (" + records.length + ")";
        return records;
      }

      function showPreview(index, record) {
        const sceneId = "apercu:" + index + ":" + record.id;
        previewOf = { pointId: currentId };
        viewer.addScene(sceneId, {
          type: "equirectangular",
          panorama: "/p/" + index + "/selections/" + record.id + ".jpg?t=" + Date.now(),
        });
        viewer.loadScene(sceneId, viewer.getPitch(), viewer.getYaw(), viewer.getHfov());
        say("");
        $("apercu-nom").textContent = "Aperçu : " + record.nom;
        $("apercu").style.display = "flex";
        $("outils").style.display = "none";
      }

      $("retour").onclick = () => {
        if (!previewOf) return;
        viewer.loadScene(previewOf.pointId, viewer.getPitch(), viewer.getYaw(), viewer.getHfov());
      };

      $("mes-selections").onclick = async () => {
        const box = $("liste");
        if (box.style.display === "block") { box.style.display = "none"; return; }
        const index = pointIndex();
        const records = await refreshList();
        box.replaceChildren();
        if (!records.length) box.textContent = "Aucune sélection pour ce point.";
        for (const record of records) {
          const line = document.createElement("div");
          line.className = "ligne";
          const label = document.createElement("span");
          label.textContent = record.nom;
          if (record.perimee) {
            const note = document.createElement("div");
            note.className = "perimee";
            note.textContent = "panorama refait depuis : à reprendre";
            label.appendChild(note);
          }
          const painted = colorOf(index, record.id);
          if (painted) {
            const swatch = document.createElement("span");
            swatch.className = "pastille";
            swatch.style.background = painted.couleur;
            swatch.title = "Repeinte en " + (painted.teinte || painted.couleur);
            label.prepend(swatch);
            if (painted.teinte) {
              const shade = document.createElement("div");
              shade.className = "perimee";
              shade.style.color = "#bbb";
              shade.textContent = painted.teinte;
              label.appendChild(shade);
            }
          }
          const see = document.createElement("button");
          see.textContent = "Voir";
          see.onclick = () => { box.style.display = "none"; showPreview(index, record); };
          const repaint = document.createElement("button");
          repaint.textContent = "Repeindre";
          repaint.onclick = () => { box.style.display = "none"; startPaint(index, record); };
          const buttons = [see, repaint];
          if (painted) {
            const undo = document.createElement("button");
            undo.textContent = "Sans couleur";
            undo.title = "Annuler la recoloration de cette surface";
            undo.onclick = async () => {
              try {
                await postJson("/api/couleur/annuler", { point: index, id: painted.id });
                box.style.display = "none";
                await refreshColors(index);
                say("Couleur de « " + record.nom + " » annulée.");
              } catch (error) {
                say(error.message);
              }
            };
            buttons.push(undo);
          }
          const remove = document.createElement("button");
          remove.textContent = "Supprimer";
          remove.onclick = async () => {
            const extra = painted ? " Sa couleur sera aussi annulée." : "";
            if (!window.confirm("Supprimer « " + record.nom + " » ? Le panorama ne change pas." + extra)) return;
            try {
              await postJson("/api/selection/supprimer", { point: index, id: record.id });
              line.remove();
              refreshList();
              if (painted) await refreshColors(index);
            } catch (error) {
              say(error.message);
            }
          };
          buttons.push(remove);
          line.append(label, ...buttons);
          box.appendChild(line);
        }
        box.style.display = "block";
      };

      // Étape 8 : changement de couleur d'une sélection. L'aperçu est un panorama réduit calculé par
      // le serveur ; « Appliquer » enregistre l'opération, et la visite montre le panorama modifié.
      const colorOf = (index, selectionId) => {
        const colors = look.colors[index];
        return colors ? colors.couleurs.find((c) => c.selection === selectionId) : undefined;
      };

      function updateToggle() {
        const index = pointIndex();
        const colors = index < 0 ? null : look.colors[index];
        const toggle = $("avant-apres");
        toggle.hidden = !(colors && colors.version) || state !== null;
        toggle.textContent = look.after ? "Voir l'original" : "Voir les modifications";
        toggle.title = look.after ? "Montrer le panorama d'origine (avant)" : "Montrer les modifications (après)";
      }

      // Remplace l'image de chaque scène selon le mode, et recharge la scène affichée si elle change.
      function updateScenes() {
        for (const [index, point] of info.points.entries()) {
          const url = look.url(index);
          const changed = look.scenes[point.id].panorama !== url;
          look.scenes[point.id] = Object.assign({}, look.scenes[point.id], { panorama: url });
          viewer.addScene(point.id, look.scenes[point.id]);
          if (changed && point.id === currentId && !previewOf) {
            viewer.loadScene(point.id, viewer.getPitch(), viewer.getYaw(), viewer.getHfov());
          }
        }
        updateToggle();
      }

      async function refreshColors(index) {
        const answer = await fetch("/p/" + index + "/couleurs.json");
        look.colors[index] = answer.ok ? await answer.json() : null;
        updateScenes();
      }

      $("avant-apres").onclick = () => {
        look.after = !look.after;
        updateScenes();
        say(look.after ? "Après : avec les modifications." : "Avant : panorama d'origine.");
      };

      let trial = 0, timer = null;
      const blobs = [];
      const swatches = [];

      // Nuancier : teintes murales de visionneuse/nuancier.json, plus une case « Personnaliser ».
      const custom = document.createElement("label");
      custom.className = "teinte perso";
      custom.title = "Personnaliser : choisir n'importe quelle couleur";
      custom.innerHTML = "<span aria-hidden=\"true\">+</span>";
      const picker = document.createElement("input");
      picker.type = "color";
      picker.value = "#e8e2d6";
      picker.setAttribute("aria-label", "Couleur personnalisée");
      custom.appendChild(picker);

      fetch("/nuancier.json").then((r) => r.ok ? r.json() : { familles: [] }).catch(() => ({ familles: [] }))
        .then((palette) => {
          const box = $("nuancier");
          for (const family of palette.familles || []) {
            const title = document.createElement("div");
            title.className = "famille";
            title.textContent = family.nom;
            const row = document.createElement("div");
            row.className = "teintes";
            for (const shade of family.teintes || []) {
              const button = document.createElement("button");
              button.className = "teinte";
              button.style.background = shade.couleur;
              button.title = shade.nom;
              button.setAttribute("aria-label", shade.nom);
              button.onclick = () => choose(shade.couleur, shade.nom, true);
              swatches.push({ button, couleur: shade.couleur.toLowerCase(), nom: shade.nom });
              row.appendChild(button);
            }
            box.append(title, row);
          }
          const title = document.createElement("div");
          title.className = "famille";
          title.textContent = "Sur mesure";
          const row = document.createElement("div");
          row.className = "teintes";
          row.appendChild(custom);
          box.append(title, row);
        });

      // Couleur de peinture actuelle du mur, pour en déduire l'éclairage : blanc par défaut, une
      // couleur connue, ou « photo » (la couleur du mur sur la photo, quand on ne la connaît pas).
      const WHITE = "#f4f4f0";
      function currentValue() {
        const mode = $("actuelle").value;
        if (mode === "blanc") return WHITE;
        if (mode === "photo") return "photo";
        return $("actuelle-couleur").value.toLowerCase();
      }
      function showCurrent(value) {
        $("actuelle").value = value === "photo" ? "photo" : (!value || value === WHITE ? "blanc" : "autre");
        if ($("actuelle").value === "autre") $("actuelle-couleur").value = value;
        $("actuelle-couleur").hidden = $("actuelle").value !== "autre";
      }
      $("actuelle").addEventListener("change", () => {
        showCurrent(currentValue());
        if (paint) { clearTimeout(timer); timer = setTimeout(tryColor, 0); }
      });
      $("actuelle-couleur").addEventListener("input", () => {
        if (paint) { clearTimeout(timer); timer = setTimeout(tryColor, 300); }
      });

      // Choisit une couleur ; `shade` est le nom de la teinte du nuancier, null pour une couleur libre.
      function choose(color, shade, now) {
        if (!paint) return;
        paint.color = color.toLowerCase();
        paint.shade = shade;
        for (const swatch of swatches) {
          swatch.button.classList.toggle("actif", shade !== null && swatch.couleur === paint.color);
        }
        custom.classList.toggle("actif", shade === null);
        if (shade === null) custom.style.background = paint.color;
        $("teinte-choisie").textContent = "· " + (shade || "Personnalisée " + paint.color);
        clearTimeout(timer);
        timer = setTimeout(tryColor, now ? 0 : 300);
      }

      function startPaint(index, record) {
        const painted = colorOf(index, record.id);
        paint = { index, record, color: null, shade: null };
        $("peinture-nom").textContent = record.nom;
        $("teinte-choisie").textContent = "· choisir une teinte";
        custom.style.background = "";
        custom.classList.remove("actif");
        for (const swatch of swatches) swatch.button.classList.remove("actif");
        showCurrent(painted ? painted.couleur_actuelle : WHITE);
        $("outils").style.display = "none";
        $("peinture").style.display = "flex";
        say("Choisir une teinte : l'aperçu s'affiche dans la visite.");
        if (painted) {
          picker.value = painted.couleur;
          choose(painted.couleur, painted.teinte || null, true);
        }
      }

      async function tryColor() {
        if (!paint || !paint.color) return;
        const ticket = ++trial;
        const { index, record, color, shade } = paint;
        try {
          const response = await postJson("/api/couleur/apercu", {
            point: index, selection: record.id, couleur: color, actuelle: currentValue(),
          });
          const url = URL.createObjectURL(await response.blob());
          blobs.push(url);
          if (ticket !== trial || !paint) return;
          const pointId = previewOf ? previewOf.pointId : currentId;
          viewer.addScene("apercu:peinture", { type: "equirectangular", panorama: url });
          viewer.loadScene("apercu:peinture", viewer.getPitch(), viewer.getYaw(), viewer.getHfov());
          previewOf = { pointId };
          say("Aperçu : " + (shade || color) + ". Appliquer pour l'enregistrer.");
        } catch (error) {
          say(error.message);
        }
      }

      function endPaint() {
        const back = previewOf ? previewOf.pointId : currentId;
        paint = null;
        $("peinture").style.display = "none";
        $("outils").style.display = "flex";
        if (previewOf) viewer.loadScene(back, viewer.getPitch(), viewer.getYaw(), viewer.getHfov());
        setTimeout(() => { while (blobs.length) URL.revokeObjectURL(blobs.pop()); }, 2000);
      }

      picker.addEventListener("input", () => choose(picker.value, null, false));
      $("renoncer").onclick = () => { endPaint(); say(""); };
      $("appliquer").onclick = async () => {
        if (!paint) return;
        if (!paint.color) { say("Choisir d'abord une teinte dans le nuancier."); return; }
        const { index, record, color, shade } = paint;
        try {
          await postJson("/api/couleur/appliquer", {
            point: index, selection: record.id, couleur: color, teinte: shade, actuelle: currentValue(),
          });
          look.after = true;
          say("Recoloration enregistrée. Préparation du panorama modifié...");
          // Les scènes d'abord : le retour à la visite charge alors directement le panorama modifié.
          await refreshColors(index);
          endPaint();
          say("« " + record.nom + " » repeinte. « Voir l'original » pour comparer.");
        } catch (error) {
          say(error.message);
        }
      };
      document.addEventListener("keydown", (event) => { if (paint && event.key === "Escape") { endPaint(); say(""); } });
      updateToggle();

      // Étape 9 : remplacement d'un objet. On trace un cadre sur la vue immobilisée ; le serveur
      // découpe une vue centrée sur le cadre, le modèle la refait d'après la consigne (2 minutes
      // environ, dans un fil à part), et seul l'intérieur du cadre entre dans le panorama modifié.
      const frameLayer = $("calque-cadre"), frame = $("cadre");
      let drawing = null, polling = null;
      const SUGGESTIONS = [
        "un canapé en velours vert", "un fauteuil en tissu gris clair", "une bibliothèque en bois foncé",
        "une table ronde en bois clair", "un buffet bas blanc", "une plante verte en pot",
      ];
      for (const text of SUGGESTIONS) {
        const chip = document.createElement("button");
        chip.textContent = text;
        chip.onclick = () => { $("nouveau").value = text; };
        $("suggestions").appendChild(chip);
      }

      // Vue carrée de l'écran, comme pour la sélection : même direction, champ couvrant l'écran.
      function screenView() {
        const rect = $("panorama").getBoundingClientRect();
        const hfov = viewer.getHfov();
        const vfov = 2 * Math.atan(Math.tan(toRad(hfov) / 2) * rect.height / rect.width) * 180 / Math.PI;
        const fov = Math.min(Math.max(hfov, vfov), 120);
        const scale = ((rect.width / 2) / Math.tan(toRad(hfov) / 2)) / (512 / Math.tan(toRad(fov) / 2));
        return { cap: viewer.getYaw(), hauteur: viewer.getPitch(), champ: fov, size: 1024, rect, scale };
      }
      const toView = (view, x, y) => [
        view.size / 2 + (x - view.rect.left - view.rect.width / 2) / view.scale,
        view.size / 2 + (y - view.rect.top - view.rect.height / 2) / view.scale,
      ];

      function setDrawing(on) {
        frameLayer.style.display = on ? "block" : "none";
        $("outils").style.display = on ? "none" : "flex";
        if (!on) { frame.style.display = "none"; $("remplacement").style.display = "none"; drawing = null; }
      }

      $("transformer").onclick = async () => {
        if (state || paint) return;
        const answer = await fetch("/api/generation").then((r) => r.json());
        if (!answer.disponible) { say(answer.message); return; }
        if (answer.travail && answer.travail.etat === "en_cours") {
          say("Une génération est déjà en cours : attendre qu'elle finisse."); return;
        }
        drawing = { view: screenView(), start: null, box: null };
        setDrawing(true);
        say("Tracer un cadre autour de l'objet à remplacer, en le prenant en entier.");
      };

      frameLayer.addEventListener("pointerdown", (event) => {
        if (!drawing) return;
        event.preventDefault();
        frameLayer.setPointerCapture(event.pointerId);
        drawing.start = [event.clientX, event.clientY];
        drawing.box = null;
        $("remplacement").style.display = "none";
      });
      frameLayer.addEventListener("pointermove", (event) => {
        if (!drawing || !drawing.start) return;
        const [x0, y0] = drawing.start;
        const left = Math.min(x0, event.clientX), top = Math.min(y0, event.clientY);
        drawing.box = [left, top, Math.max(x0, event.clientX), Math.max(y0, event.clientY)];
        Object.assign(frame.style, {
          display: "block", left: left + "px", top: top + "px",
          width: drawing.box[2] - left + "px", height: drawing.box[3] - top + "px",
        });
      });
      frameLayer.addEventListener("pointerup", () => {
        if (!drawing || !drawing.start) return;
        drawing.start = null;
        const box = drawing.box;
        if (!box || box[2] - box[0] < 20 || box[3] - box[1] < 20) {
          frame.style.display = "none";
          say("Cadre trop petit : tracer un cadre autour de l'objet entier.");
          return;
        }
        $("remplacement").style.display = "flex";
        say("Décrire l'objet et son remplacement, puis Générer. On peut retracer le cadre.");
        $("objet").focus();
      });

      $("renoncer-generation").onclick = () => { setDrawing(false); say(""); };
      document.addEventListener("keydown", (event) => {
        if (drawing && event.key === "Escape") { setDrawing(false); say(""); }
      });

      $("generer").onclick = async () => {
        if (!drawing || !drawing.box) return;
        const view = drawing.view;
        const [ax, ay] = toView(view, drawing.box[0], drawing.box[1]);
        const [bx, by] = toView(view, drawing.box[2], drawing.box[3]);
        const target = $("objet").value.trim(), replacement = $("nouveau").value.trim();
        if (!target) { say("Dire quel objet remplacer, par exemple « le canapé gris »."); return; }
        // Nom court pour la liste (80 caractères au plus côté serveur) : le remplacement suffit.
        let name = replacement || "sans " + target;
        if (name.length > 60) name = name.slice(0, 59).trimEnd() + "…";
        try {
          await postJson("/api/generation/lancer", {
            point: pointIndex(), cap: view.cap, hauteur: view.hauteur, champ: view.champ,
            cadre: [ax, ay, bx, by], objet: target, nouveau: replacement, nom: name,
          });
          setDrawing(false);
          say("");
          follow();
        } catch (error) {
          say(error.message);
        }
      };

      // Suivi de la génération en cours, par le serveur : passe après passe.
      function follow() {
        clearTimeout(polling);
        const box = $("suivi");
        const tick = async () => {
          let job = null;
          try { job = (await fetch("/api/generation").then((r) => r.json())).travail; } catch (error) { /* réessai */ }
          if (!job) { polling = setTimeout(tick, 2000); return; }
          if (job.etat === "en_cours") {
            box.style.display = "block";
            $("suivi-texte").textContent = "Génération : " + job.message + " · " + job.secondes + " s";
            $("suivi-barre").style.width = Math.round(100 * job.passe / job.passes) + "%";
            polling = setTimeout(tick, 1500);
            return;
          }
          box.style.display = "none";
          if (job.etat === "terminee") {
            look.after = true;
            await refreshColors(job.point);
            say("« " + job.fiche.nom + " » : fait en " + job.secondes + " s. « Voir l'original » pour comparer.");
          } else {
            say("La génération a échoué : " + job.message);
          }
          refreshReplacements();
        };
        tick();
      }

      // Remplacements enregistrés du point affiché : refaire (autre essai), supprimer.
      function replacements(index) {
        const colors = look.colors[index];
        return colors && colors.generations ? colors.generations : [];
      }
      function refreshReplacements() {
        const index = pointIndex();
        const count = index < 0 ? 0 : replacements(index).length;
        $("mes-remplacements").textContent = "Remplacements (" + count + ")";
        $("mes-remplacements").hidden = count === 0;
      }
      viewer.on("scenechange", refreshReplacements);

      $("mes-remplacements").onclick = () => {
        const box = $("liste");
        if (box.style.display === "block") { box.style.display = "none"; return; }
        const index = pointIndex();
        box.replaceChildren();
        for (const record of replacements(index)) {
          const line = document.createElement("div");
          line.className = "ligne";
          const label = document.createElement("span");
          label.textContent = record.nom;
          const again = document.createElement("button");
          again.textContent = "Refaire";
          again.title = "Autre essai avec le même cadre et la même consigne (2 minutes environ)";
          again.onclick = async () => {
            try {
              await postJson("/api/generation/refaire", { point: index, id: record.id });
              box.style.display = "none";
              follow();
            } catch (error) {
              say(error.message);
            }
          };
          const remove = document.createElement("button");
          remove.textContent = "Supprimer";
          remove.onclick = async () => {
            if (!window.confirm("Supprimer « " + record.nom + " » ? Le panorama d'origine ne change pas.")) return;
            try {
              await postJson("/api/generation/supprimer", { point: index, id: record.id });
              box.style.display = "none";
              await refreshColors(index);
              refreshReplacements();
              say("« " + record.nom + " » supprimé.");
            } catch (error) {
              say(error.message);
            }
          };
          line.append(label, again, remove);
          box.appendChild(line);
        }
        box.style.display = "block";
      };

      fetch("/api/generation").then((r) => r.json()).then((answer) => {
        $("transformer").hidden = false;
        if (!answer.disponible) $("transformer").title = answer.message;
        if (answer.travail && answer.travail.etat === "en_cours") follow();
      });
      refreshReplacements();

      fetch("/api/selection").then((r) => r.json()).then((answer) => {
        $("choisir").hidden = false;
        $("mes-selections").hidden = false;
        if (!answer.disponible) $("choisir").title = answer.message;
      });
      refreshList();
    }

    // Tant que le panorama est en cours d'assemblage, on interroge le serveur chaque seconde.
    function poll() {
      fetch("/status.json")
        .then((response) => response.json())
        .then((state) => {
          if (state.status === "ready") {
            startViewer();
          } else if (state.status === "error") {
            show("L'assemblage du panorama a échoué : " + state.error, null, "");
          } else {
            show("Génération de la visite en cours", state.progress, state.message);
            setTimeout(poll, 1000);
          }
        })
        .catch(() => show("Le serveur ne répond plus. Est-il toujours lancé ?", null, ""));
    }

    poll();
  </script>
</body>
</html>
